name: CI

# La logica sta in nigrosimone/wp-plugin-ci, condivisa da tutti i plugin.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: nigrosimone/wp-plugin-ci/.github/workflows/plugin-ci.yml@v1
    with:
      min-php: '7.0-'
      # DA COMPILARE dopo la prima esecuzione: i rilievi del Plugin Check che si
      # sceglie di accettare, su una riga sola e senza spazi. Vanno esclusi anche
      # in phpcs.xml.dist, e le due liste vanno tenute allineate.
      plugin-check-ignore-codes: 'WordPress.WP.AlternativeFunctions.file_get_contents_file_get_contents,WordPress.WP.AlternativeFunctions.file_system_operations_file_put_contents,WordPress.WP.AlternativeFunctions.file_system_operations_readfile,WordPress.WP.AlternativeFunctions.unlink_unlink,WordPress.WP.AlternativeFunctions.parse_url_parse_url,WordPress.PHP.NoSilencedErrors.Discouraged,WordPress.Security.NonceVerification.Recommended,WordPress.Security.ValidatedSanitizedInput.InputNotSanitized,WordPress.Security.ValidatedSanitizedInput.InputNotValidated,WordPress.Security.ValidatedSanitizedInput.MissingUnslash,WordPress.NamingConventions.PrefixAllGlobals.NonPrefixedConstantFound,PluginCheck.CodeAnalysis.WriteFile.PluginDirectoryWrite,PluginCheck.CodeAnalysis.WriteFile.ABSPATHDetected'