name: Prepara rilascio

# Passo 1 di 2 del rilascio: prepara le modifiche di versione e apre una Pull
# Request. Il rilascio vero parte al merge, tramite release.yml.
# La logica sta in nigrosimone/wp-plugin-ci.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Nuova versione (X.Y.Z)'
        required: true
        type: string
      tested_up_to:
        description: 'Tested up to (lascia vuoto per non cambiarlo)'
        required: false
        type: string
        default: ''
      changelog:
        description: 'Voci del changelog, separate da ";"'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    uses: nigrosimone/wp-plugin-ci/.github/workflows/plugin-prepare-release.yml@v1
    with:
      version: ${{ inputs.version }}
      tested_up_to: ${{ inputs.tested_up_to }}
      changelog: ${{ inputs.changelog }}